[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "repopilot"
version = "0.0.1"
description = "Adaptive multi-agent system for software debugging and repair"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "langgraph>=1.2.20,<2",
    "pathspec>=0.12,<1",
    "pydantic>=2.8,<3",
    "PyYAML>=6.0,<7",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4,<9",
]

[project.scripts]
repopilot = "repopilot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
